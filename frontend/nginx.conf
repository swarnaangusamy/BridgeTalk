server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses history-based routing, so /lobby/ABC-123 is a real URL
    # the server has no file for. Without this fallback every route except "/"
    # returns 404 on a hard refresh — the single most common way a working SPA
    # breaks once it is served by a real web server rather than Vite's dev
    # server, which handles this automatically.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames change on every build, so they can be cached
    # permanently. index.html must NOT be, or browsers keep serving an old
    # shell that references deleted asset files.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # The MediaPipe hand model is ~7.5 MB and never changes for a given
    # version, so it is worth caching hard. Served with the right type or
    # some browsers refuse it.
    location ~* \.task$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        types { application/octet-stream task; }
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
