<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BridgeTalk — real-time sign language to text translation inside a video call."
    />
    <!-- Dark, so the meeting room does not flash white before React mounts. -->
    <meta name="theme-color" content="#202124" />
    <title>BridgeTalk</title>

    <!-- Roboto and Material Symbols, per the interface specification.
         preconnect first: it opens the TLS connection while the HTML is still
         parsing, which removes about 100 ms from first paint.

         `display=block` on the icon font is deliberate. The icons are
         ligatures, so with `swap` the browser paints the literal ligature
         names ("mic", "videocam") in a fallback font for a moment, and the
         control bar visibly reads as words before turning into icons.
         `block` shows nothing until the font arrives, which is the lesser
         evil. Every icon is aria-hidden with its label on the button, so a
         screen reader is unaffected either way. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- React mounts here. The noscript message matters: this is an
         accessibility project, so a JavaScript-disabled visitor gets a real
         explanation rather than a blank page. -->
    <div id="root"></div>
    <noscript>
      BridgeTalk needs JavaScript to run hand tracking in your browser. Please
      enable JavaScript and reload this page.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
